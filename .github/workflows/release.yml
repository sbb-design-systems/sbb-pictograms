name: Release
on:
  workflow_dispatch:
    inputs:
      commitType:
        description: "Commit Type"
        required: true
        default: "refactor"
        type: choice
        options:
          - feat
          - fix
          - refactor
      commitMessage:
        description: "Commit Message"
        required: true
        default: "update icons"
        type: string
      commitVersion:
        description: "Commit Version"
        required: true
        default: "auto"
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: write
      contents: write
      id-token: write # Required for OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: "npm"
          node-version-file: ".nvmrc"
          scope: sbb-esta
      - run: npm clean-install

      - name: "Release: Set git user"
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'

      - name: Extract icons
        run: npm run fetchPictograms
        env:
          API_KEY: ${{ secrets.PICTOGRAMM_API_KEY }}

      - name: Commit changes
        run: |
          git add --all
          git commit -m "${{ inputs.commitType }}: ${{ inputs.commitMessage }}\n\nActor: ${{ github.actor }}"

      - name: "Release: Create release with commit-and-tag-version"
        if: ${{ inputs.commitVersion == 'auto' }}
        run: npx commit-and-tag-version

      - name: "Release: Create release with commit-and-tag-version"
        if: ${{ inputs.commitVersion != 'auto' }}
        run: npx commit-and-tag-version --release-as ${{ inputs.commitVersion }}

      - name: "Release: Push release to repository"
        run: git push --follow-tags origin main

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1
      - name: Upload icons and indexes to s3
        run: aws s3 cp . s3://cloudfront-icon-cdn-backend-esta-web-prod --recursive --exclude "*" --include "picto/*.svg" --include "picto/index.json"

